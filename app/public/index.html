<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de Usuarios</title>
<style>
body{font-family:Arial,sans-serif;max-width:860px;margin:30px auto;padding:0 12px}
input,select,button{padding:7px;margin:3px}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{border:1px solid #ccc;padding:6px;text-align:left}
.err{color:#b00020}
</style></head><body>
<h1>Gestión de Usuarios</h1>

<section id="login-view">
  <h2>Iniciar sesión</h2>
  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button id="btn-login">Entrar</button>
  <p id="login-error" class="err"></p>
</section>

<section id="app-view" hidden>
  <p>Sesión: <b id="who"></b> <button id="btn-logout">Salir</button></p>
  <h2 id="form-title">Nuevo usuario</h2>
  <input id="u-name" placeholder="Nombre">
  <input id="u-email" placeholder="Correo">
  <input id="u-password" type="password" placeholder="Contraseña">
  <select id="u-role"><option>user</option><option>admin</option></select>
  <button id="btn-save">Guardar</button>
  <button id="btn-cancel" hidden>Cancelar</button>
  <p id="form-error" class="err"></p>
  <table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr></thead>
  <tbody id="users"></tbody></table>
</section>

<script>
let token = null, editId = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  return { status: r.status, json: await r.json() };
}
$('btn-login').onclick = async () => {
  const r = await api('/api/login', 'POST', { email: $('email').value, password: $('password').value });
  if (r.status !== 200) { $('login-error').textContent = r.json.message; return; }
  token = r.json.data.token; $('who').textContent = r.json.data.user.name;
  $('login-error').textContent = '';
  $('login-view').hidden = true; $('app-view').hidden = false; load();
};
$('btn-logout').onclick = () => { token = null; $('app-view').hidden = true; $('login-view').hidden = false; };
let cache = [];
async function load() {
  const r = await api('/api/users'); cache = r.json.data;
  $('users').innerHTML = cache.map(u => `<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td>
   <td><button onclick="edit(${u.id})">Editar</button> <button onclick="del(${u.id})">Eliminar</button></td></tr>`).join('');
}
function edit(id) { const u = cache.find(x => x.id === id); editId = id; $('u-name').value = u.name; $('u-email').value = u.email; $('u-role').value = u.role; $('u-password').value = ''; $('form-title').textContent = 'Editar usuario'; $('btn-cancel').hidden = false; }
function reset() { editId = null; ['u-name', 'u-email', 'u-password'].forEach(i => $(i).value = ''); $('form-title').textContent = 'Nuevo usuario'; $('btn-cancel').hidden = true; }
$('btn-cancel').onclick = reset;
$('btn-save').onclick = async () => {
  const body = { name: $('u-name').value, email: $('u-email').value, role: $('u-role').value };
  if ($('u-password').value) body.password = $('u-password').value;
  const r = editId ? await api('/api/users/' + editId, 'PUT', body) : await api('/api/users', 'POST', body);
  $('form-error').textContent = r.status >= 400 ? r.json.message : '';
  if (r.status < 400) { reset(); load(); }
};
async function del(id) { await api('/api/users/' + id, 'DELETE'); load(); }
</script></body></html>
