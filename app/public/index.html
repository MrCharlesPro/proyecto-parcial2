<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de Usuarios</title>
<style>
:root{--bg:#0f172a;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#6366f1;--brand2:#8b5cf6;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(160deg,#0f172a 0%,#1e1b4b 100%);min-height:100vh;color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;color:#fff}
header h1{font-size:20px;margin:0;display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:700}
main{max-width:980px;margin:0 auto;padding:12px 20px 60px}
.card{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:20px}
#login-view{max-width:400px;margin:60px auto}
#login-view h2{margin-top:0}
label{font-size:13px;color:var(--muted);display:block;margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#f8fafc}
input:focus,select:focus{outline:2px solid var(--brand);background:#fff}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;background:#e2e8f0;color:var(--ink)}
button:hover{filter:brightness(.95)}
.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.danger{background:#fee2e2;color:var(--bad)}
.ghost{background:rgba(255,255,255,.15);color:#fff}
#btn-login{width:100%;margin-top:18px;padding:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;color:#fff}
.stat b{display:block;font-size:28px}
.stat span{font-size:13px;opacity:.75}
.form{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end}
.form label{margin:0 0 4px}
.row-actions{display:flex;gap:6px;margin-top:10px}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px;border-bottom:2px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line)}
tr:hover td{background:#f8fafc}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.admin{background:#ede9fe;color:#6d28d9}
.badge.user{background:#dcfce7;color:#15803d}
.actions button{padding:6px 12px;margin-right:6px}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:10px}
@media(max-width:760px){.form{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}}
</style></head><body>
<header><h1><span class="logo">U</span> Gestión de Usuarios</h1>
  <div id="session" hidden>Sesión: <b id="who"></b> <button id="btn-logout" class="ghost">Salir</button></div></header>
<main>
<section id="login-view" class="card">
  <h2>Iniciar sesión</h2>
  <label for="email">Correo</label><input id="email" placeholder="admin@demo.com" autocomplete="username">
  <label for="password">Contraseña</label><input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  <button id="btn-login" class="primary">Entrar</button>
  <p id="login-error" class="err"></p>
</section>

<section id="app-view" hidden>
  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>Usuarios totales</span></div>
    <div class="stat"><b id="s-admin">0</b><span>Administradores</span></div>
    <div class="stat"><b id="s-user">0</b><span>Usuarios estándar</span></div>
  </div>
  <div class="card">
    <h2 id="form-title" style="margin-top:0">Nuevo usuario</h2>
    <div class="form">
      <div><label for="u-name">Nombre</label><input id="u-name" placeholder="Nombre"></div>
      <div><label for="u-email">Correo</label><input id="u-email" placeholder="Correo"></div>
      <div><label for="u-password">Contraseña</label><input id="u-password" type="password" placeholder="Contraseña"></div>
      <div><label for="u-role">Rol</label><select id="u-role"><option>user</option><option>admin</option></select></div>
      <div class="row-actions"><button id="btn-save" class="primary">Guardar</button><button id="btn-cancel" hidden>Cancelar</button></div>
    </div>
    <p id="form-error" class="err"></p>
  </div>
  <div class="card">
    <table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr></thead>
    <tbody id="users"></tbody></table>
  </div>
</section>
</main>
<footer>Desplegado con GitHub Actions · Monitoreado con OpenTelemetry + OpenObserve</footer>

<script>
let token = null, editId = null, cache = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  return { status: r.status, json: await r.json() };
}
$('btn-login').onclick = async () => {
  const r = await api('/api/login', 'POST', { email: $('email').value, password: $('password').value });
  if (r.status !== 200) { $('login-error').textContent = r.json.message; return; }
  token = r.json.data.token; $('who').textContent = r.json.data.user.name;
  $('login-error').textContent = '';
  $('login-view').hidden = true; $('app-view').hidden = false; $('session').hidden = false; load();
};
$('btn-logout').onclick = () => { token = null; $('app-view').hidden = true; $('session').hidden = true; $('login-view').hidden = false; };
async function load() {
  const r = await api('/api/users'); cache = r.json.data;
  $('s-total').textContent = cache.length;
  $('s-admin').textContent = cache.filter(u => u.role === 'admin').length;
  $('s-user').textContent = cache.filter(u => u.role !== 'admin').length;
  $('users').innerHTML = cache.map(u => `<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td>
   <td><span class="badge ${u.role === 'admin' ? 'admin' : 'user'}">${esc(u.role)}</span></td>
   <td class="actions"><button onclick="edit(${u.id})">Editar</button><button class="danger" onclick="del(${u.id})">Eliminar</button></td></tr>`).join('');
}
function edit(id) { const u = cache.find(x => x.id === id); editId = id; $('u-name').value = u.name; $('u-email').value = u.email; $('u-role').value = u.role; $('u-password').value = ''; $('form-title').textContent = 'Editar usuario'; $('btn-cancel').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' }); }
function reset() { editId = null; ['u-name', 'u-email', 'u-password'].forEach(i => $(i).value = ''); $('form-title').textContent = 'Nuevo usuario'; $('btn-cancel').hidden = true; }
$('btn-cancel').onclick = reset;
$('btn-save').onclick = async () => {
  const body = { name: $('u-name').value, email: $('u-email').value, role: $('u-role').value };
  if ($('u-password').value) body.password = $('u-password').value;
  const r = editId ? await api('/api/users/' + editId, 'PUT', body) : await api('/api/users', 'POST', body);
  $('form-error').textContent = r.status >= 400 ? r.json.message : '';
  if (r.status < 400) { reset(); load(); }
};
async function del(id) { await api('/api/users/' + id, 'DELETE'); load(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('login-view').hidden) $('btn-login').click(); });
</script></body></html>
